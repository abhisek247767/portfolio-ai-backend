name: Auto Version Tag

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the branch that was merged into main
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Works for merge commits, squash merges and rebase merges
          BRANCH=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].head.ref // empty' 2>/dev/null || true)

          # Fallback: look at the commit message (e.g. "Merge branch 'feature/login'")
          if [ -z "$BRANCH" ]; then
            BRANCH=$(git log -1 --pretty=%B)
          fi

          echo "Source branch/info: $BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: version
        run: |
          LATEST=$(git tag --list 'v*.*.*' | sort -V | tail -n1)
          LATEST=${LATEST:-v0.0.0}
          echo "Latest tag: $LATEST"

          VERSION=${LATEST#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if echo "${{ steps.source.outputs.name }}" | grep -qi "feature"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.version.outputs.new }}"
          git push origin "${{ steps.version.outputs.new }}"
          gh release create "${{ steps.version.outputs.new }}" \
            --title "${{ steps.version.outputs.new }}" \
            --generate-notes